<form
  [formGroup]="authForm"
  (ngSubmit)="onSubmit()"
  class="space-y-5 form-login shadow-lg"
  aria-label="Formulario de inicio de sesión"
>

  <!-- CORREO ELECTRÓNICO -->
  <app-input-field
    label="Correo electrónico"
    type="email"
    placeholder="tu@correo.com"
    iconClass="icon-[mdi--email]"
    inputId="login-email"
    autocomplete="email"
    [required]="true"
    [control]="emailControl"
    [errorMessages]="emailErrors"
  ></app-input-field>


  <!-- MENSAJE RECUPERAR CONTRASEÑA -->
  @if (showForgotPasswordHint()) {
    <p
      class="mt-1.5 text-xs text-azul-oscuro"
      role="alert"
    >
      Ingresa tu correo electrónico para recuperar tu contraseña.
    </p>
  }


  <!-- CONTRASEÑA -->
  <div>

    <div class="flex items-center justify-between mb-1.5">

      <label
        for="login-password"
        class="text-sm font-medium text-slate-700"
      >
        Contraseña
      </label>

      <button
        type="button"
        (click)="onForgotPassword()"
        class="text-xs font-medium text-azul-oscuro hover:underline focus:outline-none focus:ring-2 focus:ring-azul-oscuro rounded"
      >
        ¿Olvidaste tu contraseña?
      </button>

    </div>


    <app-input-field
      type="password"
      placeholder="••••••••"
      iconClass="icon-[mdi--lock]"
      inputId="login-password"
      autocomplete="current-password"
      [required]="true"
      [minlength]="6"
      [control]="passwordControl"
      [errorMessages]="passwordErrors"
      [showTogglePassword]="true"
    ></app-input-field>

  </div>


  <!-- RECORDAR SESIÓN -->
  <app-checkbox-field
    label="Recordarme en este dispositivo"
    inputId="remember-me"
    [control]="rememberMeControl"
  ></app-checkbox-field>


  <!-- BOTÓN LOGIN -->
  <app-auth-button
    label="Iniciar sesión"
    iconClass="icon-[mdi--arrow-right]"
    type="submit"
    [disabled]="authForm.invalid"
    [loading]="loading"
  ></app-auth-button>

</form>
