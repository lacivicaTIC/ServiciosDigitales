<!-- Mobile overlay -->
@if (mobileOpen()) {
  <div
    class="fixed inset-0 z-40 bg-black/50 lg:hidden"
    (click)="onBackdropClick()"
    aria-hidden="true"
  ></div>
}

<aside
  class="fixed top-0 left-0 z-50 min-h-screen w-64 flex flex-col text-white transition-transform duration-300 ease-in-out lg:static lg:translate-x-0"
  style="background-color: #132C45;"
  [class.-translate-x-full]="!mobileOpen()"
  [class.translate-x-0]="mobileOpen()"
  aria-label="Menú principal"
>
  <!-- Brand -->
  <header class="flex items-center gap-3 px-6 py-5 border-b border-white/10">
    <span class="icon-[mdi--car] text-3xl text-amarillo" aria-hidden="true"></span>
    <div>
      <p class="text-base font-bold leading-tight tracking-wide">SECRETARIA</p>
      <p class="text-xs text-white/80">Tránsito</p>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-4 py-6" aria-label="Navegación del dashboard">
    <!-- Principal -->
    <div class="mb-6">
      <p class="px-3 mb-2 text-[10px] font-bold uppercase tracking-wider text-white/50">Principal</p>
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-amarillo !text-azul-oscuro"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-white/90 transition-colors hover:bg-white/10"
      >
        <span class="icon-[mdi--home] text-xl" aria-hidden="true"></span>
        Inicio
      </a>
    </div>

    <!-- Gestión -->
    <div class="mb-6">
      <p class="px-3 mb-2 text-[10px] font-bold uppercase tracking-wider text-white/50">Modulos</p>

      <button
        type="button"
        (click)="toggleCitas()"
        class="flex w-full items-center justify-between rounded-lg px-3 py-2.5 text-sm font-medium text-white/90 transition-colors hover:bg-white/10"
        [attr.aria-expanded]="citasOpen()"
        aria-controls="submenu-citas"
      >
        <span class="flex items-center gap-3">
          <span class="icon-[mdi--calendar] text-xl" aria-hidden="true"></span>
          Citas
        </span>
        <span
          class="icon-[mdi--chevron-down] text-lg transition-transform duration-200"
          [class.rotate-180]="citasOpen()"
          aria-hidden="true"
        ></span>
      </button>

      @if (citasOpen()) {
        <ul id="submenu-citas" class="mt-1 space-y-1 border-l border-white/20 ml-5 pl-4">
          <li>
            <a
              routerLink="/dashboard/citas"
              class="flex items-center gap-2 rounded-md px-3 py-2 text-sm text-white/80 transition-colors hover:bg-white/10 hover:text-white"
            >
              <span class="icon-[mdi--calendar-clock] text-lg" aria-hidden="true"></span>
              Consultar Citas
            </a>
          </li>
          <li>
            <a
              routerLink="/dashboard/citas/crear"
              class="flex items-center gap-2 rounded-md px-3 py-2 text-sm text-white/80 transition-colors hover:bg-white/10 hover:text-white"
            >
              <span class="icon-[mdi--calendar-plus] text-lg" aria-hidden="true"></span>
              Crear Cita
            </a>
          </li>
        </ul>
      }
    </div>
  </nav>

  <!-- Footer -->
  <footer class="border-t border-white/10 px-4 py-4">
    <ul class="space-y-1">
      <li>
        <a
          routerLink="/dashboard/ayuda"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-white/80 transition-colors hover:bg-white/10 hover:text-white"
        >
          <span class="icon-[mdi--help-circle] text-xl" aria-hidden="true"></span>
          Ayuda
        </a>
      </li>
      <li>
        <a
          routerLink="/dashboard/configuracion"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-white/80 transition-colors hover:bg-white/10 hover:text-white"
        >
          <span class="icon-[mdi--cog] text-xl" aria-hidden="true"></span>
          Configuración
        </a>
      </li>
      <li>
        <button
          type="button"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-white/80 transition-colors hover:bg-white/10 hover:text-white"
        >
          <span class="icon-[mdi--logout] text-xl" aria-hidden="true"></span>
          Cerrar sesión
        </button>
      </li>
    </ul>
  </footer>
</aside>
